<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ebiten Web Game</title>
    <script src="wasm_exec.js"></script>
    <script>
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then(
        (result) => {
          go.run(result.instance);
        }
      );
    </script>
    <style>
      body {
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
  </head>
  <body></body>
</html>
